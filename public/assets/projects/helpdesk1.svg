<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hd-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hd-bg)"/>
  <!-- Window Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#0f172a"/>
  <circle cx="68" cy="62" r="6" fill="#ef4444"/>
  <circle cx="88" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="108" cy="62" r="6" fill="#10b981"/>
  <text x="400" y="67" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="500">Laravel Helpdesk &amp; Ticket Management Dashboard</text>
  <!-- Sidebar -->
  <rect x="40" y="84" width="160" height="376" fill="#0f172a" opacity="0.6"/>
  <rect x="60" y="110" width="120" height="28" rx="6" fill="url(#hd-accent)" opacity="0.2"/>
  <text x="75" y="129" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="600">● Tickets (14)</text>
  <rect x="60" y="150" width="120" height="24" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="60" y="184" width="120" height="24" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="60" y="218" width="120" height="24" rx="4" fill="#334155" opacity="0.4"/>
  <!-- Content Area -->
  <rect x="230" y="110" width="140" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="246" y="136" fill="#94a3b8" font-family="sans-serif" font-size="11">OPEN TICKETS</text>
  <text x="246" y="172" fill="#f43f5e" font-family="sans-serif" font-size="28" font-weight="bold">12</text>
  <rect x="390" y="110" width="140" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="406" y="136" fill="#94a3b8" font-family="sans-serif" font-size="11">IN PROGRESS</text>
  <text x="406" y="172" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">05</text>
  <rect x="550" y="110" width="180" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="566" y="136" fill="#94a3b8" font-family="sans-serif" font-size="11">RESOLVED (30d)</text>
  <text x="566" y="172" fill="#10b981" font-family="sans-serif" font-size="28" font-weight="bold">148</text>
  <!-- Ticket Table Mockup -->
  <rect x="230" y="210" width="500" height="220" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="230" y="210" width="500" height="36" fill="#1e293b"/>
  <text x="250" y="233" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">ID</text>
  <text x="300" y="233" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">CUSTOMER / ISSUE</text>
  <text x="540" y="233" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">PRIORITY</text>
  <text x="640" y="233" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">STATUS</text>
  <!-- Row 1 -->
  <line x1="230" y1="282" x2="730" y2="282" stroke="#334155" stroke-width="1"/>
  <text x="250" y="268" fill="#94a3b8" font-family="monospace" font-size="11">#1042</text>
  <text x="300" y="268" fill="#f8fafc" font-family="sans-serif" font-size="12">Payment gateway timeout on checkout</text>
  <rect x="540" y="255" width="56" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
  <text x="568" y="269" fill="#ef4444" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">HIGH</text>
  <rect x="640" y="255" width="65" height="20" rx="4" fill="#f59e0b" opacity="0.2"/>
  <text x="672" y="269" fill="#f59e0b" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">PENDING</text>
  <!-- Row 2 -->
  <line x1="230" y1="328" x2="730" y2="328" stroke="#334155" stroke-width="1"/>
  <text x="250" y="314" fill="#94a3b8" font-family="monospace" font-size="11">#1041</text>
  <text x="300" y="314" fill="#f8fafc" font-family="sans-serif" font-size="12">User profile photo upload sync failure</text>
  <rect x="540" y="301" width="56" height="20" rx="4" fill="#38bdf8" opacity="0.2"/>
  <text x="568" y="315" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">MEDIUM</text>
  <rect x="640" y="301" width="65" height="20" rx="4" fill="#10b981" opacity="0.2"/>
  <text x="672" y="315" fill="#10b981" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">SOLVED</text>
</svg>
